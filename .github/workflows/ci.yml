name: CI

on:
  push:
    branches: [main, foundation/sih26044-v0.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client and guidance engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Validate knowledge base
        run: npm run kb:validate

      - name: Run guidance QA
        run: npm run qa:guidance

      - name: Run deterministic regression QA
        run: npm run qa:guidance-regression

      - name: Run product audit QA
        run: npm run qa:product

      - name: Run trending normalization QA
        run: npm run qa:trending

      - name: Run evidence integrity QA
        run: npm run qa:evidence-integrity

      - name: Run SIH26044 boundary QA
        run: npm run qa:sih-boundary

      - name: Run SIH browser read contract QA
        run: npm run qa:sih-browser-reads

      - name: Run opportunity readiness QA
        run: npm run qa:opportunity-readiness

      - name: Run controlled demo isolation QA
        run: npm run qa:demo-isolation

      - name: Run controlled demo golden flow QA
        run: npm run qa:demo-flow

      - name: Run recruiter projection privacy QA
        run: npm run qa:recruiter-projection

      - name: Run SIH26044 persistence schema security QA
        run: npm run qa:sih-persistence-schema

      - name: Run SIH26044 foundation freeze hardening QA
        run: npm run qa:foundation-freeze-hardening

      - name: Run production convergence boundary QA
        run: npm run qa:production-convergence

      - name: Run institution intervention convergence QA
        run: npx tsx scripts/institution-interventions-qa.ts

      - name: Build production client
        run: npm run build

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check Worker
        run: npx tsc --noEmit

      - name: Run Worker tests
        run: npm test

      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run

  database:
    name: Disposable Supabase D2 Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start minimal disposable Supabase
        run: npx --yes supabase@latest start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run D1 database execution gate
        run: docker exec -i supabase_db_careercase-sih26044-foundation psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/sih26044_rls.sql

      - name: Run opportunity authoring atomicity gate
        run: docker exec -i supabase_db_careercase-sih26044-foundation psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/sih26044_opportunity_authoring.sql

      - name: Run institution aggregate privacy gate
        run: docker exec -i supabase_db_careercase-sih26044-foundation psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/sih26044_institution_analytics.sql

      - name: Run institution intervention lifecycle gate
        run: docker exec -i supabase_db_careercase-sih26044-foundation psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/sih26044_institution_interventions.sql

      - name: Run D2 trusted-role and foundation security gate
        run: docker exec -i supabase_db_careercase-sih26044-foundation psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/sih26044_d2_readiness.sql

      - name: Run Storage API integration gate
        run: node scripts/sih-storage-api-integration-test.mjs

      - name: Run D2 Foundation Worker integration gate
        run: npm run qa:d2-readiness-integration

      - name: Stop disposable Supabase
        if: always()
        run: npx --yes supabase@latest stop --no-backup
