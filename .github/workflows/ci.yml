name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client and guidance engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Validate knowledge base
        run: npm run kb:validate

      - name: Run guidance QA
        run: npm run qa:guidance

      - name: Run deterministic regression QA
        run: npm run qa:guidance-regression

      - name: Run product audit QA
        run: npm run qa:product

      - name: Run trending normalization QA
        run: npm run qa:trending

      - name: Run evidence integrity QA
        run: npm run qa:evidence-integrity

      - name: Run SIH26044 boundary QA
        run: npm run qa:sih-boundary

      - name: Run opportunity readiness QA
        run: npm run qa:opportunity-readiness

      - name: Build production client
        run: npm run build

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check Worker
        run: npx tsc --noEmit

      - name: Run Worker tests
        run: npm test
