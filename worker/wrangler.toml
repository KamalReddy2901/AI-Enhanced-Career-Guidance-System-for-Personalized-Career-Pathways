name = "careercaseai"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[ratelimits]]
name = "SIH_RATE_LIMITER"
namespace_id = "2604401"

[ratelimits.simple]
limit = 60
period = 60

[vars]
ENVIRONMENT = "production"

# SUPABASE_URL and SUPABASE_ANON_KEY are configured as Worker secrets. They
# let the worker validate the caller's bearer token before proxying an AI call.
# SUPABASE_ELEVATED_KEY is also an encrypted Worker secret used only after the
# caller has been resolved through sih26044.current_actor_id().
