name = "careercaseai"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
SUPABASE_URL = "https://your-project-ref.supabase.co"
SUPABASE_ANON_KEY = "your_supabase_anon_key_here"

# Set secrets via: wrangler secret put GROQ_API_KEYS
# SUPABASE_URL and SUPABASE_ANON_KEY are public Supabase client values. They
# let the worker validate the caller's bearer token before proxying an AI call.
