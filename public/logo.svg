<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="24" fill="#000000"/>
  <!-- Magnifier glass circle -->
  <circle cx="21" cy="20" r="9" stroke="white" stroke-width="3.5" fill="none"/>
  <!-- Magnifier handle -->
  <line x1="27.5" y1="26.5" x2="35" y2="34" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- CC monogram inside glass -->
  <text x="13.5" y="24.5" font-family="Georgia, serif" font-size="9" font-weight="700" fill="white" letter-spacing="-0.5">CC</text>
</svg>
